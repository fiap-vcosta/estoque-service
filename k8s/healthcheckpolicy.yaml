apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: estoque-service
  namespace: tech-challenge
spec:
  default:
    checkIntervalSec: 15
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 2
    config:
      type: HTTP
      httpHealthCheck:
        portSpecification: USE_SERVING_PORT
        requestPath: /estoque/health
  targetRef:
    group: ""
    kind: Service
    name: estoque-service
