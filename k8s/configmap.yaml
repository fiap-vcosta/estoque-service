apiVersion: v1
kind: ConfigMap
metadata:
  name: estoque-service
  namespace: tech-challenge
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  # TLS termina no Gateway; Kestrel escuta HTTP só dentro do cluster.
  ASPNETCORE_URLS: "http://+:8080" # NOSONAR
  Jwt__Funcionario__Issuer: "autenticacao-service"
  Jwt__Funcionario__Audience: "funcionario"
  Jwt__Funcionario__JwksUrl: "https://vcosta-fiap.online/autenticacao/.well-known/jwks.json"
  Jwt__Funcionario__RequireHttpsMetadata: "true"
  Jwt__Cliente__Issuer: "autenticacao-service"
  Jwt__Cliente__Audience: "cliente"
  Jwt__Cliente__JwksUrl: "https://vcosta-fiap.online/autenticacao/.well-known/jwks.json"
  Jwt__Cliente__RequireHttpsMetadata: "true"
  CLOUD_SQL_CONNECTION_NAME: "vcosta-fiap-tech-challenge:us-central1:estoque-service-pg"
  PubSub__ProjectId: "vcosta-fiap-tech-challenge"
  PubSub__UseInMemory: "false"
  PubSub__EnableWorkers: "true"
  PubSub__Subscriptions__OrdemServicoAprovada: "estoque-ordem-servico-aprovada"
  PubSub__Subscriptions__OrdemServicoFinalizada: "estoque-ordem-servico-finalizada"
  PubSub__Subscriptions__OrdemServicoDescartada: "estoque-ordem-servico-descartada"
  DD_SERVICE: "estoque-service"
  DD_ENV: "prod"
  DD_AGENT_HOST: "127.0.0.1"
  DD_TRACE_AGENT_PORT: "8126"
  DD_LOGS_INJECTION: "true"
  DD_RUNTIME_METRICS_ENABLED: "true"
  DD_TRACE_SAMPLE_RATE: "1"
  DD_SITE: "${DD_SITE}"
  CORECLR_ENABLE_PROFILING: "1"
  CORECLR_PROFILER: "{846F5F1C-F9AE-4B07-969E-05C26BC060D8}"
  CORECLR_PROFILER_PATH: "/app/datadog/linux-x64/Datadog.Trace.ClrProfiler.Native.so"
  DD_DOTNET_TRACER_HOME: "/app/datadog"
  LD_LIBRARY_PATH: "/app/datadog/linux-x64"
