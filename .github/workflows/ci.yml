name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dotnet:
    uses: fiap-vcosta/actions/.github/workflows/ci-dotnet.yml@main
    permissions:
      contents: read
      packages: read
    with:
      sonar_project_key: fiap-vcosta_estoque-service
      enable_github_packages: true
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  terraform:
    uses: fiap-vcosta/actions/.github/workflows/ci-terraform.yml@main
    permissions:
      contents: read
    with:
      run_plan: false
